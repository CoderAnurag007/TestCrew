# TestCrew on one server (a VPS with Docker). Everything runs here:
# Postgres, Redis, the API, two workers, the website and Caddy for HTTPS.
#
#   cp infrastructure/deploy/.env.production.example infrastructure/deploy/.env.production
#   # fill it in, point APP_DOMAIN and API_DOMAIN at this server's IP, then:
#   docker compose -f infrastructure/deploy/docker-compose.prod.yml --env-file infrastructure/deploy/.env.production up -d --build
#
# Screenshots and reports go to a shared volume, or to S3/R2 when S3_* is set.

name: testcrew

x-app-env: &app-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgresql://${POSTGRES_USER:-testcrew}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-testcrew}
  REDIS_URL: redis://redis:6379
  WEB_ORIGIN: https://${APP_DOMAIN:?set APP_DOMAIN}
  SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
  CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?set CREDENTIAL_ENCRYPTION_KEY}
  COOKIE_SECURE: ${COOKIE_SECURE:-true}
  COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
  ARTIFACT_DIR: /data/artifacts
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_REGION: ${S3_REGION:-auto}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
  SENTRY_DSN: ${SENTRY_DSN:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-testcrew}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-testcrew}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-testcrew}']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Sessions and the audit queue live here, so keep them across restarts.
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build: &build
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-testcrew}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-testcrew}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      <<: *build
      target: api
    restart: unless-stopped
    environment: *app-env
    volumes:
      - artifacts:/data/artifacts
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build:
      <<: *build
      target: worker
    restart: unless-stopped
    environment:
      <<: *app-env
      AI_PROVIDER: ${AI_PROVIDER:-auto}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1}
      SMTP_URL: ${SMTP_URL:-}
      ALERT_FROM: ${ALERT_FROM:-}
    volumes:
      - artifacts:/data/artifacts
    # Browsers need shared memory; each worker runs up to two audits at once.
    shm_size: 1gb
    deploy:
      replicas: ${WORKER_REPLICAS:-2}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    build:
      <<: *build
      target: web
      args:
        NEXT_PUBLIC_API_URL: https://${API_DOMAIN:?set API_DOMAIN}
    restart: unless-stopped
    environment:
      NODE_ENV: production
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

volumes:
  pg_data:
  redis_data:
  artifacts:
  caddy_data:
  caddy_config:
