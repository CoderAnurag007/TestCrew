services:
  postgres:
    image: postgres:16-alpine
    container_name: auditor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: auditor
      POSTGRES_PASSWORD: auditor
      POSTGRES_DB: auditor
    ports:
      - "5432:5432"
    volumes:
      - auditor_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auditor -d auditor"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: auditor-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - auditor_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  auditor_pg_data:
  auditor_redis_data:
